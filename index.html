<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Team Group project</title>
</head>
<body>
   <main class="container pb-5">
       
        <section class="col-lg-6">
                <div class="form-panel rounded-4 p-4">
                    <h2 class="h4 fw-bold mb-1">Create a portfolio</h2>

                    <form id="profile-form">
                        <label class="form-label" for="displayName">Name *</label>
                        <input class="form-control mb-3" id="displayName" required maxlength="80"
                               placeholder="e.g. John Justice">

                        <label class="form-label" for="enjoy">What I enjoy</label>
                        <input class="form-control mb-3" id="enjoy" required  placeholder="e.g. Designing websites">

                        <label class="form-label" for="tried">What I've tried</label>
                        <input class="form-control mb-3" id="tried" required  placeholder="e.g. My first group project">

                        <label class="form-label" for="curious">What I'm curious about</label>
                        <input class="form-control mb-3" id="curious" required   placeholder="e.g. Cloud computing">
                        <button class="btn btn-success flex-grow-1" type="submit">Submit</button>
                    </form>
                </div>
            </section> 
   </main>
</body>
</html>
